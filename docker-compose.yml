version: "3.9"

services:
  utama:
    build: ./sanca_app
    container_name: sanca_app
    ports:
      - "8000:80"
    restart: unless-stopped

  satu:
    build: ./satu
    container_name: satu_app
    ports:
      - "8001:80"

  dua:
    build: ./dua
    container_name: dua_app
    ports:
      - "8002:80"
