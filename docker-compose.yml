version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mixsum_db
      MYSQL_USER: mixsum_user
      MYSQL_PASSWORD: mixsum_pass
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    # JANGAN expose port kecuali perlu
    ports:
      - "3306:3306"
  # utama:
  #   build: ./finance
  #   container_name: sanca_app
  #   ports:
  #     - "8003:3000"
  #   restart: unless-stopped
  mixsum_admin:
    build: ./admin.mixsum.co.id
    container_name: mixsum_admin_app
    ports:
      - "8004:80"
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: mixsum_db
      DB_USERNAME: mixsum_user
      DB_PASSWORD: mixsum_pass

  satu:
    build: ./satu
    container_name: satu_app
    ports:
      - "8001:80"

  dua:
    build: ./dua
    container_name: dua_app
    ports:
      - "8002:80"
